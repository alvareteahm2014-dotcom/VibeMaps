<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0A0A0D">
<meta name="color-scheme" content="dark light">
<meta name="description" content="VibeMaps: descubre dónde está la gente que encaja contigo.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VibeMaps">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VibeMaps</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="phone">
  <!-- Onboarding: idioma, perfil, ubicación y plan -->
  <section id="onboarding" aria-live="polite"></section>

  <!-- App -->
  <main id="app" class="hidden">
    <section class="view" id="view-map">
      <div id="mapa" data-zl="mini"></div>
      <div class="mapa-top">
        <label class="sel-m"><i id="dot-momento"></i><span id="lbl-momento"></span><select id="sel-momento" aria-label="Momento"></select></label>
        <span class="esp"></span>
        <button class="fab" id="btn-tema" type="button" aria-label="Tema"></button>
        <button class="fab" id="btn-centrar" type="button" aria-label="Mi ubicación"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      </div>
      <div id="pista-zoom" class="hidden"></div>
      <button id="pista-lock" class="hidden" type="button"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span></span></button>
      <div id="resumen-mapa"></div>
    </section>
    <section class="view hidden" id="view-explore"></section>
    <section class="view hidden" id="view-radar"></section>
    <section class="view hidden" id="view-favs"></section>
    <section class="view hidden" id="view-profile"></section>
    <nav id="nav" aria-label="Navegación"></nav>
    <div id="sheet-bg"></div>
    <div id="sheet" role="dialog" aria-modal="true"></div>
  </main>

  <div id="modal" class="hidden"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<noscript><p style="padding:24px;font-family:sans-serif">VibeMaps necesita JavaScript / needs JavaScript.</p></noscript>
<script src="vendor/leaflet.js"></script>
<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
